name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same compiler as rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          components: clippy, rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --release --locked
      # The app window: a full round trip (picture in, message hidden, picture
      # saved, message revealed) in the real system web view.
      - if: runner.os != 'Linux'
        run: cargo build --locked -p cipheris
      - if: runner.os == 'macOS'
        run: target/debug/cipheris --selftest
        timeout-minutes: 5
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & target\debug\cipheris.exe --selftest
          exit $LASTEXITCODE
        timeout-minutes: 5

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: cargo build --release --locked
      - run: npm install --no-save --no-package-lock playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/e2e/ui.test.mjs target/release/cipheris screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots

  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: pip install "cryptography>=44"
      - run: python3 -I tools/crosscheck.py crates/core/tests/vectors/v1_cheap.hex "correct horse battery staple" "byte-exact payload"

  supply-chain:
    name: supply-chain (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin, x86_64-pc-windows-msvc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses bans sources
          arguments: --all-features --target ${{ matrix.target }}
      # Second opinion without any third party tool (once, for all targets),
      # limited to the crates that the release builds contain.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          for t in x86_64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            cargo metadata --format-version 1 --locked --filter-platform "$t" > "/tmp/meta-$t.json"
          done
          git clone --depth 1 https://github.com/rustsec/advisory-db /tmp/advisory-db
          python3 -I tools/audit_lock.py Cargo.lock /tmp/advisory-db /tmp/meta-*.json
