name: release

# Publish a release on GitHub with a tag such as v0.2.0; this workflow then
# attaches the apps, SHA256 checksums and a software bill of materials.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo test --workspace --locked
      - run: packaging/macos/build-app.sh --universal
      # The shipped app must open its window and complete a round trip.
      - run: dist/CIPHERIS.app/Contents/MacOS/cipheris --selftest
        timeout-minutes: 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CIPHERIS-macOS
          path: dist/CIPHERIS-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p cipheris
      # The shipped app must open its window and complete a round trip. The
      # release build has no console, so only the exit code tells.
      - shell: pwsh
        run: |
          $p = Start-Process -FilePath target\release\cipheris.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "selftest failed ($($p.ExitCode))"; exit 1 }
        timeout-minutes: 5
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/CIPHERIS | Out-Null
          Copy-Item target/release/cipheris.exe dist/CIPHERIS/CIPHERIS.exe
          Copy-Item packaging/windows/cipheris.ico dist/CIPHERIS/
          Copy-Item LICENSE dist/CIPHERIS/
          Compress-Archive -Path dist/CIPHERIS -DestinationPath dist/CIPHERIS-Windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CIPHERIS-Windows
          path: dist/CIPHERIS-Windows.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: 1.97.0
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p cipheris
      - run: |
          mkdir -p dist/cipheris
          cp target/release/cipheris packaging/linux/cipheris.desktop packaging/linux/cipheris.png LICENSE dist/cipheris/
          tar -C dist -czf dist/CIPHERIS-Linux.tar.gz cipheris
      - run: |
          cargo metadata --format-version 1 --locked > metadata.json
          python3 -I tools/sbom.py Cargo.lock metadata.json > dist/CIPHERIS-SBOM.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CIPHERIS-Linux
          path: |
            dist/CIPHERIS-Linux.tar.gz
            dist/CIPHERIS-SBOM.cdx.json

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: dist/*
          generate_release_notes: true
